[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "python-udf-jit"
version = "0.1.0"
description = "Transparent scalar Python UDF JIT piercing"
requires-python = ">=3.11,<3.15"
dependencies = []

[project.scripts]
udfjitctl = "python_udf_jit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"python_udf_jit.resources" = ["*.pth"]
